# sane-ipp configuration
#
# Directories searched for this file: each of SANE_CONFIG_DIR, then the
# SANE configuration directory (usually /etc/sane.d). Every file found is
# read in that order, so a later one overrides an earlier one.

[debug]
# Print debug messages on stderr. SANE_DEBUG_IPP overrides this, and
# takes a level too: 1 errors, 2 milestones, 3 steps (what "true"
# means), 4 whole IPP messages.
#enable = true

# Directory for trace files. Opening a device writes everything that
# happens to it, IPP messages included, to <program>-<device>.log in
# this directory, replacing the file from the previous time. Like in
# the shell, "~/" means your home directory. The directory is created
# if missing.
#trace = ~/ipp/trace
